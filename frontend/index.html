<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaguepedia Interview Scraper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Leaguepedia Interview Scraper</h1>
      <p>Cole os links das matérias/vídeos e gere automaticamente o template <code>ExternalContent/Line</code>.</p>
    </header>

    <section class="card">
      <label for="urls">Links das matérias</label>
    <textarea
      id="urls"
      placeholder="Cole um link por linha.
    
    Ex.:
  https://maisesports.com.br/...
  https://sheepesports.com/...
  https://youtube.com/..."
      autofocus
    ></textarea>

      <p class="hint">
        Publicação, torneio, tipo de conteúdo, tradutor e vídeo são detectados automaticamente.
      </p>

      <div class="actions">
        <button id="scrape">Gerar Templates</button>
        <button id="clear" class="secondary">Limpar</button>
      </div>

      <p id="status" class="status"></p>
    </section>

    <section id="results"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
